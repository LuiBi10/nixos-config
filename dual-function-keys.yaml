# Tap/hold behavior, used by interception-tools in configuration.nix
MAPPINGS:
  # CapsLock: Esc on tap, Ctrl on hold
  - KEY: KEY_CAPSLOCK
    TAP: KEY_ESC
    HOLD: KEY_LEFTCTRL
  # Right Alt: Ctrl+Alt on tap, Ctrl+Shift on hold
  - KEY: KEY_RIGHTALT
    TAP: [KEY_LEFTCTRL, KEY_LEFTALT]
    HOLD: [KEY_LEFTCTRL, KEY_LEFTSHIFT]
  # Menu: Esc on tap, Ctrl on hold
  - KEY: KEY_MENU
    TAP: KEY_ESC
    HOLD: KEY_LEFTCTRL
